<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selection Sort Visualizer — SORTLAB</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/visualization.css" />
    <link rel="stylesheet" href="../css/components/controls.css" />
    <link rel="stylesheet" href="../css/components/algorithm-indicators.css" />
  </head>
  <body>
    <main class="app comparison-app" data-algorithm="selection">
      <a class="back-home" href="../index.html">← SORTLAB home</a>
      <header>
        <h1>Selection Sort</h1>
        <p>Find the smallest value in the unsorted section, then place it at the front. Repeat until every value is in order.</p>
        <div class="badges"><b>TIME&nbsp; O(n²) AVERAGE</b><b>SPACE&nbsp; O(1)</b></div>
      </header>
      <section class="meta"><span>n = <strong id="length">10</strong></span><span id="arrayText"></span></section>
      <section class="viewport">
        <div id="stage"></div>
        <div class="algorithm-indicators" aria-hidden="true">
          <span id="minimumTag" class="indicator indicator-minimum">MIN</span>
          <span id="currentTag" class="indicator indicator-current">CURRENT</span>
          <span id="scanningTag" class="indicator indicator-scanning">SCANNING</span>
        </div>
      </section>
      <section class="status">
        <button id="operationStat">Ready to begin</button>
        <button id="comparisonStat">Comparisons: 0</button>
        <button id="swapStat">Swaps: 0</button>
        <button id="minimumStat">Minimum: —</button>
        <button id="destinationStat">Destination: —</button>
      </section>
      <section class="controls">
        <button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button>
        <button id="reset">↻ Reset</button><button id="step">Step Forward</button>
        <label>Speed <input id="speed" type="range" min="0.5" max="3" value="1" step="0.5"></label>
        <input id="custom" type="text" placeholder="Custom array, e.g. 4, 2, 8, 1" aria-label="Custom array">
        <button id="apply">Apply</button>
      </section>
      <p class="array-error" id="arrayError" role="status" aria-live="polite"></p>
      <section class="code">
        <div class="codeTitle"><i></i><i></i><i></i><b>selection_sort.py</b><em id="phaseText">Ready</em></div>
        <pre id="source"></pre>
      </section>
    </main>
    <script type="module" src="../js/algorithms/selection-sort.js"></script>
  </body>
</html>
